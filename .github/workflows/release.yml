# CPA Desk releases. Every push to main that touches the app publishes the next version
# (feat: minor, fix and everything else: patch, "type!:" major), with release notes built
# from the commit messages. Installed copies of CPA Desk find the release through
# latest.json, download and verify it, and install on the next restart.
# Run it by hand from the Actions tab to choose the bump.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'design/**'
      - 'screenshots/**'
      - 'tests/**'
      # Release tooling alone doesn't change the app.
      - 'scripts/release-notes.sh'
      - 'scripts/next-version.sh'
      - 'scripts/install-latest.sh'
      - 'scripts/publish-dev.sh'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and core
        id: meta
        run: |
          version="$(scripts/next-version.sh "${{ inputs.bump || 'auto' }}")"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already exists" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "core_repo=$(sed -nE 's/^repo=(.*)$/\1/p' core.ref)"
            echo "core_ref=$(sed -nE 's/^ref=(.*)$/\1/p' core.ref)"
            echo "core_version=$(sed -nE 's/^version=(.*)$/\1/p' core.ref)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.core_repo }}
          ref: ${{ steps.meta.outputs.core_ref }}
          path: .build/core-src

      - uses: actions/setup-go@v5
        with:
          go-version-file: .build/core-src/go.mod
          cache-dependency-path: .build/core-src/go.sum

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build core
        id: core
        run: |
          archive="$(scripts/build-core.sh .build/core-src "${{ steps.meta.outputs.core_version }}" .build/core)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Build and sign CPA Desk
        env:
          DESK_VERSION: ${{ steps.meta.outputs.version }}
          DESK_UPDATER_ARTIFACTS: '1'
          RUSTUP_TOOLCHAIN: stable
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./build-desk.sh prod "${{ steps.core.outputs.archive }}"

      - name: Release notes and update feed
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          bundle="src-tauri/target/release/bundle/macos"
          asset="CPA-Desk_${VERSION}_aarch64.app.tar.gz"
          mkdir -p .build/release
          cp "$bundle/CPA Desk.app.tar.gz" ".build/release/$asset"
          cp "$bundle/CPA Desk.app.tar.gz.sig" ".build/release/$asset.sig"
          scripts/release-notes.sh "$VERSION" "${{ steps.meta.outputs.core_version }}" "${{ steps.meta.outputs.core_ref }}" > .build/release/notes.md
          # The in-app updater shows everything above the install instructions.
          sed '/^### Install/,$d' .build/release/notes.md > .build/release/app-notes.md
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes .build/release/app-notes.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile signature ".build/release/$asset.sig" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/v$VERSION/$asset" \
            '{version: $version, notes: $notes, pub_date: $date,
              platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' \
            > .build/release/latest.json
          (cd .build/release && shasum -a 256 "$asset" > SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "CPA Desk $VERSION" \
            --notes-file .build/release/notes.md \
            ".build/release/CPA-Desk_${VERSION}_aarch64.app.tar.gz" \
            ".build/release/CPA-Desk_${VERSION}_aarch64.app.tar.gz.sig" \
            .build/release/latest.json \
            .build/release/SHA256SUMS.txt
